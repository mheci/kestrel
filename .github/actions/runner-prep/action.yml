name: runner prep for disk builds
description: >
  Make an ubuntu-latest runner able to run bootc-image-builder: reclaim disk,
  lift the AppArmor bwrap confinement that breaks osbuild's bind mounts, and
  put root container storage on a btrfs loopback block device. Only the
  nightly disk workflow needs this; kernel builds run in plain podman.
inputs:
  loopback-size:
    description: size of the sparse btrfs image backing /var/lib/containers/storage
    required: false
    default: "80G"
runs:
  using: composite
  steps:
    - name: Reclaim disk
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/lib/jvm /usr/share/swift /opt/hostedtoolcache/CodeQL 2>/dev/null || true
        sudo docker image prune -af >/dev/null 2>&1 || true
        df -h / /mnt | tail -2
    - name: Lift AppArmor bwrap confinement
      # Ubuntu 24.04 ships bwrap-userns-restrict, an AppArmor profile that
      # confines every bwrap child. osbuild runs its stages in bwrap and the
      # confinement denies the container-storage bind mount:
      # "mount: /run/osbuild/containers/storage: permission denied".
      shell: bash
      run: |
        if [ -f /etc/apparmor.d/bwrap-userns-restrict ]; then
          sudo apparmor_parser -R /etc/apparmor.d/bwrap-userns-restrict || true
        fi
        for p in bwrap unpriv_bwrap; do
          printf '%s' "$p" | sudo tee /sys/kernel/security/apparmor/.remove >/dev/null 2>&1 || true
        done
        sudo grep -c bwrap /sys/kernel/security/apparmor/profiles || echo "no bwrap profiles loaded"
    - name: Tools
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq podman qemu-system-x86 qemu-utils ovmf zstd btrfs-progs >/dev/null
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
        sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
    - name: Container storage on a btrfs loopback
      # osbuild inside the privileged builder cannot mount from the runner's
      # root filesystem; a real block device works. Overlay driver on top.
      shell: bash
      run: |
        set -euo pipefail
        sudo truncate -s "${{ inputs.loopback-size }}" /mnt/podman-storage.img
        sudo mkfs.btrfs -q -f -m single -d single /mnt/podman-storage.img
        sudo podman system reset --force >/dev/null 2>&1 || true
        sudo systemctl stop podman.service podman.socket 2>/dev/null || true
        loop=$(sudo losetup --find --show --direct-io=on /mnt/podman-storage.img)
        sudo mkdir -p /mnt/podman-storage /var/lib/containers/storage
        sudo mount -o compress-force=zstd:2,discard=async,noatime "$loop" /mnt/podman-storage
        sudo mkdir -p /mnt/podman-storage/storage
        sudo mount --bind /mnt/podman-storage/storage /var/lib/containers/storage
        printf '[storage]\ndriver = "overlay"\nrunroot = "/run/containers/storage"\ngraphroot = "/var/lib/containers/storage"\n' | sudo tee /etc/containers/storage.conf >/dev/null
        sudo podman info --format '{{.Store.GraphDriverName}} {{.Store.GraphRoot}}'
        df -h /var/lib/containers/storage | tail -1
