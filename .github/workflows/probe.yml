name: probe
on:
  workflow_dispatch:
jobs:
  consumer-facts:
    runs-on: ubuntu-latest
    steps:
      - name: kinoite-main internals
        run: |
          set -x; set +e
          podman pull -q ghcr.io/ublue-os/kinoite-main:latest
          podman run --rm ghcr.io/ublue-os/kinoite-main:latest bash -c '
            echo "== dracut conf"; for f in /usr/lib/dracut/dracut.conf.d/* /etc/dracut.conf.d/*; do echo "--- $f"; cat "$f"; done 2>/dev/null | grep -v "^#" | grep -v "^$"
            echo "== ostree dracut module present?"; ls -d /usr/lib/dracut/modules.d/*ostree* /usr/lib/dracut/modules.d/*bootc* 2>&1
            echo "== who requires kernel-core / kernel"; rpm -q --whatrequires kernel-core kernel kernel-modules kernel-modules-core kernel-modules-extra 2>&1
            echo "== dnf5 remove dry run"; dnf5 -y remove --assumeno --setopt=protect_running_kernel=false kernel kernel-core kernel-modules kernel-modules-core kernel-modules-extra 2>&1 | tail -40
            echo "== libdnf5 conf.d"; ls -la /etc/dnf/libdnf5.conf.d/ 2>&1; cat /etc/dnf/libdnf5.conf.d/*.conf 2>/dev/null
            echo "== rpmdb path"; ls -la /var/lib/rpm /usr/share/rpm 2>&1 | head -5; readlink -f /var/lib/rpm
            echo "== kernel-core scripts"; rpm -q --scripts kernel-core | head -60
            echo "== kmod zstd?"; ldd /usr/bin/kmod | grep -i zstd; ls /usr/lib/modules/*/kernel/fs/ | head -3; find /usr/lib/modules/*/kernel -name "*.ko*" | head -2
            echo "== bootc lint on base"; bootc container lint 2>&1 | tail -5
            echo "== kargs"; ls /usr/lib/bootc/kargs.d/ 2>&1; cat /usr/lib/bootc/kargs.d/* 2>/dev/null
            echo "== ostree prepare-root"; cat /usr/lib/ostree/prepare-root.conf 2>&1
            echo "== dnf5 repos"; ls /etc/yum.repos.d/
            echo "== is nvidia userspace present?"; rpm -qa | grep -i nvidia
            echo "== dnf5 version"; dnf5 --version | head -2
          '
      - name: Terra nvidia packages
        run: |
          set -x; set +e
          podman run --rm quay.io/fedora/fedora:44 bash -c '
            dnf -q -y install --repofrompath terra,https://repos.fyralabs.com/terra44 --setopt=terra.gpgcheck=0 terra-release >/dev/null 2>&1
            dnf -q -y install --enablerepo=terra terra-release-nvidia >/dev/null 2>&1
            ls /etc/yum.repos.d/
            dnf -q download --enablerepo=terra-nvidia --destdir=/tmp/rp nvidia-kmod-common nvidia-driver akmod-nvidia kmod-nvidia 2>&1 | tail -3
            for f in /tmp/rp/*.rpm; do echo "=== $f"; rpm -qp --scripts "$f" 2>/dev/null | head -80; echo "--- requires"; rpm -qpR "$f" | grep -v -E "^(lib|rtld|/|rpmlib|glibc)" ; done
            echo "=== nvidia-kmod-common files"; rpm -qpl /tmp/rp/nvidia-kmod-common*.rpm | grep -v firmware
            rpm2cpio /tmp/rp/nvidia-kmod-common*.rpm | cpio -i --to-stdout ./usr/lib/dracut/dracut.conf.d/99-nvidia.conf ./usr/lib/modprobe.d/nvidia.conf 2>/dev/null
          '
      - name: Rootless podman and kvm
        run: |
          set -x; set +e
          podman info --format "{{.Host.Security.Rootless}} {{.Store.GraphDriverName}} {{.Store.GraphRoot}}"
          mkdir -p /tmp/w && echo hi > /tmp/w/f && podman run --rm -v /tmp/w:/work quay.io/fedora/fedora:44 bash -c "id; ls -la /work; touch /work/created; nproc; free -g | head -2; df -h /work | tail -1"; ls -la /tmp/w
          ls -la /dev/kvm; id; groups
          sudo apt-get install -y -qq qemu-system-x86 ovmf >/dev/null 2>&1; qemu-system-x86_64 -accel help
          time podman pull -q quay.io/centos-bootc/bootc-image-builder:latest && podman image inspect quay.io/centos-bootc/bootc-image-builder:latest --format '{{.Size}} {{.Created}}'
          sudo fallocate -l 1G /tmp/swaptest && sudo chmod 600 /tmp/swaptest && sudo mkswap /tmp/swaptest >/dev/null && sudo swapon /tmp/swaptest && free -g | tail -1 && sudo swapoff /tmp/swaptest && sudo rm /tmp/swaptest
