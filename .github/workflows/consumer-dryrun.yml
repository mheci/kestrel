# Consumer path without a kernel build. test/standin.sh makes RPMs with the
# real specs and provides but placeholder payloads; the real artifact
# Containerfile wraps them; the real reference Containerfile runs the Terra
# transaction and kestrel-install on the kinoite base. Everything after the
# compile is exercised in minutes; only depmod, dracut, lint and boot need a
# real kernel and are left to the channel workflow.
name: consumer dry run
on:
  workflow_dispatch:
    inputs:
      channel:
        description: channel
        required: false
        default: stable
        type: choice
        options: [stable, lts]

permissions:
  contents: read

jobs:
  dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Reclaim disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/lib/jvm 2>/dev/null &
      - name: Resolve
        id: r
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/resolve.sh "${{ inputs.channel }}" want
      - name: Stand-in RPMs (real specs, placeholder payload)
        run: |
          podman build -q --build-arg FEDORA_RELEASE=${{ steps.r.outputs.fedora_release }} \
            -t localhost/kestrel-builder:dry -f containers/Containerfile.builder containers/
          podman run --rm --security-opt label=disable -v "$PWD:/repo" -e KESTREL_ROOT=/repo -w /repo \
            localhost/kestrel-builder:dry bash test/standin.sh want/want.json out
          cp want/want.json out/want.json
      - name: Artifact image
        run: |
          podman build -f containers/Containerfile.artifact \
            --build-arg KESTREL_CHANNEL=${{ inputs.channel }} \
            --build-arg KESTREL_KVER=${{ steps.r.outputs.kver }} \
            --build-arg KESTREL_NVIDIA=${{ steps.r.outputs.nvidia_version }} \
            --build-arg KESTREL_BUILD_ID=standin \
            -t localhost/kestrel:standin .
      - name: Reference image up to kestrel-install (no dracut, no lint)
        run: |
          base=$(jq -r .fedora.base_ref out/want.json)
          digest=$(jq -r .fedora.base_digest out/want.json)
          # Same file as the real reference image, minus the last RUN (kargs,
          # cleanup, bootc lint), which needs a real initramfs.
          awk '/^# What a real consumer adds/{exit} {print}' containers/Containerfile.reference > /tmp/Containerfile.dry
          podman build -f /tmp/Containerfile.dry \
            --build-arg BASE_IMAGE="${base%%:*}@${digest}" \
            --build-arg KESTREL_IMAGE=localhost/kestrel:standin \
            --build-arg NVIDIA_VERSION=${{ steps.r.outputs.nvidia_version }} \
            --build-arg FEDORA_RELEASE=${{ steps.r.outputs.fedora_release }} \
            -t localhost/kestrel-reference:dry .
      - name: Facts
        run: |
          podman run --rm localhost/kestrel-reference:dry bash -c '
            set -e
            echo "kernel dirs:"; ls /usr/lib/modules
            rpm -q kestrel-kernel kestrel-kernel-devel kestrel-nvidia-kmod nvidia-driver nvidia-kmod-common nvidia-driver-selinux
            rpm -q kernel-core && exit 1 || echo "fedora kernel gone"
            rpm -q akmod-nvidia kmod-nvidia && exit 1 || echo "no akmod/kmod-nvidia"
            echo "uname shape: $(rpm -q kestrel-kernel --qf "%{VERSION}-%{RELEASE}.%{ARCH}\n") == $(ls /usr/lib/modules)"
            echo "dnf guard:"; cat /etc/dnf/libdnf5.conf.d/90-kestrel.conf
            echo "dnf sees kernel-core as excluded:"; dnf5 -q repoquery kernel-core 2>&1 | head -2 || true
            echo "dracut config:"; cat /usr/lib/dracut/dracut.conf.d/*.conf | grep -v "^#" | grep -v "^$"
            echo "kestrel files:"; ls -la /usr/share/kestrel
            echo "boot:"; ls -A /boot || true
          '
